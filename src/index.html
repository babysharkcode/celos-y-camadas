<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Celos">
<title>Celos y Camadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: cálido y práctico, la libreta de un criador cuidadoso.
   IDEA: la tarjeta de cría del criadero — un anillo del ciclo por hembra, como un calendario circular.
   PICTURE: anillos de ciclo (proestro/estro/diestro/anestro) y de gestación con el "hoy" marcado.
   COLOUR and TYPE: ciruela profundo dominante, rosa rubor de soporte, coral del celo como acento, verde azulado para gestación; Nunito.
   LAYOUT: banda superior ciruela con navegación; agenda de anillos + lista de próximos eventos; fichas de perro; árbol de 3 generaciones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#140a16);--ink:light-dark(#241326,#f6edf4);--mute:light-dark(#6f5a70,#b9a5b8);
--plum:#2d1530;--blush:light-dark(#ffe6ea,#2a1525);--line:light-dark(#ecdfe8,#352336);
--heat:#ff4f5e;--fert:#ff8a3d;--gest:#13958f;--card:light-dark(#fff,#1d1020);--soft:light-dark(#faf4f8,#1a0e1c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:clamp(24px,4vw,32px);font-weight:900}h3{font-size:19px;font-weight:800}
.top{background:var(--plum);color:#fff;padding:max(18px,env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 0 max(5vw,16px,env(safe-area-inset-left))}
.band{padding-bottom:max(48px,env(safe-area-inset-bottom))!important}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-size:clamp(26px,5vw,38px);font-weight:900}
.brand small{display:block;color:#e9c6d6;font-size:14px;font-weight:600}
nav{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav button{background:none;border:0;color:#e9c6d6;font:800 16px Nunito,sans-serif;padding:12px 16px;border-radius:12px 12px 0 0;cursor:pointer;min-height:44px;flex:none}
nav button.on{background:var(--bg);color:var(--ink)}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px);max-width:1240px;margin:0 auto}
.btn{font:800 15px Nunito,sans-serif;border:0;border-radius:999px;padding:11px 18px;min-height:44px;cursor:pointer;background:var(--heat);color:#fff}
.btn.ghost{background:var(--blush);color:var(--ink)}.btn.sm{padding:7px 14px;min-height:36px;font-size:14px}
.btn.del{background:none;color:var(--heat);text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--fert);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--mute)}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:18px 0 28px}
.ring{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;cursor:pointer;text-align:start;font:inherit;color:inherit}
.ring svg{width:120px;height:120px}
.ring b{font-size:20px;font-weight:900;display:block}
.chip{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--blush);white-space:nowrap}
.chip.heat{background:var(--heat);color:#fff}.chip.fert{background:var(--fert);color:#fff}.chip.gest{background:var(--gest);color:#fff}
.ev{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.ev li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ev .d{font-weight:900;font-size:18px;white-space:nowrap;line-height:1.1}.ev .d span{display:block;font-size:13px;color:var(--mute);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:6px}
.dogs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}
.dog{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;text-align:start;font:inherit;color:inherit;padding:0}
.ph{aspect-ratio:4/3;background:var(--blush);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.dog div.t{padding:12px 14px 16px}.dog b{font-size:19px;font-weight:900}
.empty{border:2px dashed var(--line);border-radius:22px;padding:36px 20px;text-align:center;margin-top:18px}
.head{display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;align-items:center}
.head .ph{border-radius:20px;aspect-ratio:1}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin-top:10px;font-size:15px}
.facts span{display:block;font-size:13px;color:var(--mute)}
.sec{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.card{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gest);border-radius:99px}
.tl{list-style:none;padding:0;margin:8px 0 0;font-size:15px}.tl li{padding:4px 0;display:flex;gap:10px}.tl li b{white-space:nowrap;min-width:84px}
.tl li.past{color:var(--mute);text-decoration:line-through}
label{display:block;font-weight:800;font-size:14px;margin-top:12px}
input,select,textarea{width:100%;font:16px Nunito,sans-serif;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px;margin-top:4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.scroll{overflow-x:auto;padding-bottom:6px}
.tree{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));grid-template-rows:repeat(8,minmax(54px,auto));gap:6px 10px;min-width:660px;margin-top:12px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font:inherit;color:inherit;text-align:start;cursor:pointer;display:flex;flex-direction:column;justify-content:center;font-size:14px;line-height:1.25}
.slot b{font-size:15px}.slot em{font-style:normal;color:var(--mute);font-size:12px}
.slot.s{border-inline-start:4px solid #4a78c9}.slot.d{border-inline-start:4px solid var(--heat)}
.slot.me{background:var(--plum);color:#fff;border:0}.slot.me em{color:#e9c6d6}
.slot.nil{color:var(--mute);border-style:dashed}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9;padding:0}
.ov.on{display:flex}
.sheet{background:var(--bg);width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px max(4vw,18px) 28px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:10;display:none;max-width:90vw}
a{color:inherit}
.pl{margin-top:10px}.pr{display:grid;grid-template-columns:96px minmax(0,1fr) 48px auto 36px;gap:8px;align-items:center;padding:4px 0}
.pb{height:14px;background:var(--line);border-radius:99px;overflow:hidden}.pb i{display:block;height:100%;border-radius:99px}
.pv{font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:600px){.pr{grid-template-columns:78px minmax(0,1fr) 42px 36px}.pr .chip{display:none}}
@media(max-width:600px){.head{grid-template-columns:96px minmax(0,1fr)}.ring{grid-template-columns:96px minmax(0,1fr)}.ring svg{width:96px;height:96px}.ev li{grid-template-columns:70px minmax(0,1fr)}.ev li .chip{grid-column:2;justify-self:start}.g2{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.mk{transition:transform .6s}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Celos y Camadas<small>Ciclos, cruzas, partos y pedigrí de tus perros</small></h1>
  <button class="btn" id="addDog">Agregar perro</button></div>
  <nav><button data-v="agenda" class="on">Agenda</button><button data-v="perros">Mis perros</button><button data-v="ayuda">Más</button></nav>
</header>
<main id="app" class="band"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol==="https:"&&!(window.Capacitor&&window.Capacitor.isNativePlatform()))navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
